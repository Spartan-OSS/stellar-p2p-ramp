name: Domain reference
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m stellar_p2p.demo
  escrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test --locked --manifest-path contracts/escrow/Cargo.toml
      - run: cargo build --locked --manifest-path contracts/escrow/Cargo.toml --target wasm32v1-none --release
